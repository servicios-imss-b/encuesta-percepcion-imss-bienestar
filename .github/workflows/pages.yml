name: Deploy static frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /encuesta-percepcion-imss-bienestar/
          VITE_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbx9yes-purhvdag3VhvuplfzkhxCOPguwa_opU5-PB8w3-1Ab8YKm4X81LbeM2IUNOrIg/exec
      - name: Add SPA fallback
        run: cp dist/public/index.html dist/public/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
